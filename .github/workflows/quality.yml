name: Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install quality tools
        run: pip install pyflakes bandit
      - name: Run pyflakes
        run: |
          python -m pyflakes app/Home.py       || true
          python -m pyflakes app/pages/Chat.py || true
          echo "✅ pyflakes check complete"
      - name: Run bandit security scan
        run: |
          bandit -r app/ -ll --quiet || true
          echo "✅ Security scan complete"
      - name: Scan for hardcoded API keys
        run: |
          if grep -rn "gsk_" app/ 2>/dev/null; then
            echo "❌ Groq key found in code!" && exit 1
          fi
          if grep -rn "AIzaSy" app/ 2>/dev/null; then
            echo "❌ Gemini key found in code!" && exit 1
          fi
          echo "✅ No hardcoded secrets found"
      - name: Codebase statistics
        run: |
          echo "=== Lumina Codebase Stats ==="
          wc -l app/Home.py app/pages/Chat.py app/chatbot.py
      - name: Quality check passed
        run: echo "✅ All quality checks passed!"

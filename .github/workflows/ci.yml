name: CI — Deploy Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy-check:
    name: Validate App for Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify all imports resolve
        run: |
          python -c "import streamlit; print('✅ streamlit', streamlit.__version__)"
          python -c "import torch; print('✅ torch', torch.__version__)"
          python -c "import transformers; print('✅ transformers', transformers.__version__)"
          python -c "import groq; print('✅ groq OK')"
          python -c "import pandas; print('✅ pandas', pandas.__version__)"
          python -c "import sklearn; print('✅ scikit-learn', sklearn.__version__)"
      - name: Validate app files exist
        run: |
          test -f app/Home.py       && echo "✅ Home.py found"      || (echo "❌ Missing!" && exit 1)
          test -f app/pages/Chat.py && echo "✅ Chat.py found"      || (echo "❌ Missing!" && exit 1)
          test -f requirements.txt  && echo "✅ requirements found" || (echo "❌ Missing!" && exit 1)
      - name: Check secrets not committed
        run: |
          if git ls-files --error-unmatch .streamlit/secrets.toml 2>/dev/null; then
            echo "❌ secrets.toml is tracked!" && exit 1
          else
            echo "✅ secrets.toml NOT committed — secure!"
          fi
      - name: Python syntax check
        run: |
          python -m py_compile app/Home.py       && echo "✅ Home.py OK"
          python -m py_compile app/pages/Chat.py && echo "✅ Chat.py OK"
      - name: Deploy check passed
        run: echo "✅ All checks passed — Ready to deploy!"
